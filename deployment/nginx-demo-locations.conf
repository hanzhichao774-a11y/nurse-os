# 加入 /etc/nginx/sites-enabled/default 的 server 块，放在 location / 之前。
# iPhone 无法使用实例内部的 WebRTC ICE 地址时，走同源 HTTPS HLS。
location ^~ /hls/ {
    absolute_redirect off;
    proxy_pass http://127.0.0.1:8887/;
    proxy_redirect ~^(/.*)$ /hls$1;
    proxy_read_timeout 60s;
    proxy_buffering off;
}

# SoulX uses one same-origin WebSocket for continuously generated JPEG frames
# and cloned PCM audio. Keep this more specific prefix before /api/demo/.
location ^~ /api/demo/avatar/ws/ {
    proxy_pass http://127.0.0.1:8000/avatar/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location /api/demo/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_read_timeout 35s;
}

location ^~ /api/exam/ {
    proxy_pass http://127.0.0.1:8002/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# LiveTalking 的 aiohttp 静态路由可以直接访问 /demo/index.html，
# 但对目录 /demo/ 返回 403；此处让验收入口打开首页。
# AutoDL 公网代理使用 HTTPS :8443；不带尾部斜杠时必须返回相对跳转，
# 否则 nginx 会生成指向实例内部 HTTP :6006 的绝对地址。
location = /demo {
    absolute_redirect off;
    return 308 /demo/;
}

location = /demo/ {
    proxy_pass http://127.0.0.1:8010/demo/index.html;
}

# 高校教师资格刷题工具使用独立路径，不影响护理实训 Demo。
location = /exam {
    absolute_redirect off;
    return 308 /exam/;
}

location = /exam/ {
    proxy_pass http://127.0.0.1:8010/exam/index.html;
}

# LiveTalking 的语音开始/结束事件用于实时更新状态，长会话保持连接。
location = /sse {
    proxy_pass http://127.0.0.1:8010/sse;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
}
